name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/walton/XANON_X21

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/walton/XANON_X21

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sync OrangeFox Source
        run: |
          git config --global user.name "rohitabdullah"
          git config --global user.email "inayeemabdullah@gmail.com"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ${GITHUB_WORKSPACE}/workspace

      - name: Move Device Tree to Workspace
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/workspace/device/walton/XANON_X21
          cp -r device/walton/XANON_X21/* ${GITHUB_WORKSPACE}/workspace/device/walton/XANON_X21/

      - name: Compile Recovery
        run: |
          cd ${GITHUB_WORKSPACE}/workspace
          
          # 1. Nuke the obsolete file
          rm -f device/walton/XANON_X21/vendorsetup.sh
          
          # 2. Inject the modern Android 11+ device registration
          echo "COMMON_LUNCH_CHOICES := omni_XANON_X21-eng omni_XANON_X21-userdebug" >> device/walton/XANON_X21/AndroidProducts.mk
          
          # 3. Temporarily disable the strict crash kill-switch
          set +e
          source build/envsetup.sh
          set -e
          
          # 4. Compile
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export LC_ALL="C"
          lunch omni_XANON_X21-eng
          mka vendorbootimage

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-XANON_X21
          path: ${GITHUB_WORKSPACE}/workspace/out/target/product/XANON_X21/vendor_boot.img
